name: Test trên máy ảo – Dịch Game

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', 'tv/**', '.github/workflows/test-dichgame.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build
        working-directory: tv
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Chạy test trên máy ảo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r tv/app/build/outputs/apk/debug/app-debug.apk
            adb install -r tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set vn.dichgame.tv SYSTEM_ALERT_WINDOW allow
            adb shell am instrument -w -e class vn.dichgame.tv.TvSmokeTest vn.dichgame.tv.test/androidx.test.runner.AndroidJUnitRunner | tee tv-test.txt
            mkdir -p shots && adb pull /sdcard/Android/data/vn.dichgame.tv/files/shots shots/ || true
            grep -q "OK (" tv-test.txt
      - name: Lưu kết quả
        if: always()
        run: |
          mkdir -p ketqua && cp -r shots/* ketqua/ 2>/dev/null || true
          cp tv-test.txt ketqua/ 2>/dev/null || true
          find ketqua -name "*.png" -exec mv {} ketqua/ \; 2>/dev/null || true
          ls -la ketqua
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: anh-test
          name: Ảnh chụp test tự động
          prerelease: true
          make_latest: false
          files: |
            ketqua/*.png
            ketqua/*.txt

  phone:
    needs: tv
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: protoc + Python cho nanopb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          pip install protobuf grpcio-tools
      - name: Cài NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build bản x86_64 cho máy ảo
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon -PdichAbis=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Chạy test trên máy ảo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.metallic.chiaki.dich.SmokeTest vn.dichgame.app.test/androidx.test.runner.AndroidJUnitRunner | tee phone-test.txt
            mkdir -p shots && adb pull /sdcard/Android/data/vn.dichgame.app/files/shots shots/ || true
            adb logcat -d > phone-logcat-full.txt || true
            grep -E "DichPipeline|DichTranslator|AndroidRuntime|mlkit|MLKit|TextRecognizer" phone-logcat-full.txt | tail -300 > phone-logcat.txt || true
            grep -q "OK (" phone-test.txt
      - name: Lưu kết quả
        if: always()
        run: |
          mkdir -p ketqua
          find shots -name "*.png" -exec cp {} ketqua/ \; 2>/dev/null || true
          cp phone-test.txt phone-logcat.txt ketqua/ 2>/dev/null || true
          ls -la ketqua
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: anh-test
          name: Ảnh chụp test tự động
          prerelease: true
          make_latest: false
          files: |
            ketqua/*.png
            ketqua/*.txt

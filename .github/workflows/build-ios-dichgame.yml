name: Build iOS – Dịch Game

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/build-ios-dichgame.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo project Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Build cho iOS Simulator (kiểm tra biên dịch)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project DichGame.xcodeproj -scheme DichGame \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -40

      - name: Báo lỗi build (annotation)
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:" build.log | sort -u | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

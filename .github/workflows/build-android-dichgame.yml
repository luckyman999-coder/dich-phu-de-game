name: Build Android – Dịch Game PS5

on:
  push:
    branches: [ main, master, dichgame ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python cho nanopb
        run: pip install protobuf grpcio-tools

      - name: Cài NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/Dich-Game-PS5-Android.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Dich-Game-PS5-Android
          path: out/Dich-Game-PS5-Android.apk

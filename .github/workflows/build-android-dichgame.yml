name: Build Android – Dịch Game

on:
  push:
    branches: [ main, master, dichgame ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: protoc + Python cho nanopb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          pip install protobuf grpcio-tools

      - name: Cài NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Build bản nộp Google Play (.aab, có ký)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "chiakiKeystore=../upload.jks"
            echo "chiakiKeystorePW=$KEYSTORE_PASSWORD"
            echo "chiakiKeyAlias=$KEY_ALIAS"
            echo "chiakiKeyPW=$KEY_PASSWORD"
          } > local.properties
          ./gradlew --no-daemon bundleRelease
          mkdir -p ../out-aab
          cp app/build/outputs/bundle/release/*.aab ../out-aab/Dich-Game-GooglePlay.aab
          rm -f upload.jks local.properties

      - uses: actions/upload-artifact@v7
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: Dich-Game-GooglePlay-aab
          path: out-aab/Dich-Game-GooglePlay.aab

      - name: Báo lỗi build (annotation)
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |CMake Error|C/C\+\+: .*(error|Error)|error: " build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          find app/.cxx -name "CMakeOutput.log" -o -name "CMakeError.log" | head -3 | xargs -r tail -n 30 | head -60 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Đổi tên APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/Dich-Game-Android.apk
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: Dich-Game-Android
          path: out/Dich-Game-Android.apk

      - name: Đăng bản tải về (Release "android-moi-nhat")
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-moi-nhat
          name: Bản Android mới nhất
          prerelease: true
          make_latest: false
          body: Bản build tự động từ commit ${{ github.sha }}. Tải file Dich-Game-Android.apk về điện thoại Android để cài.
          files: out/Dich-Game-Android.apk
